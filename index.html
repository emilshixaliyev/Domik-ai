<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domik AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">
    <header class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400">Domik AI</h1>
        <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-1 rounded-full">v1.0 MVP</span>
    </header>

    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl mx-auto w-full">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 max-w-lg">
            <p class="text-sm">Salam! Mən Domik AI assistentiyəm. Sizə necə kömək edə bilərəm?</p>
        </div>
    </main>

    <footer class="p-4 border-t border-slate-800 max-w-3xl mx-auto w-full">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-sm">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-medium px-5 py-3 rounded-xl transition-colors text-sm">
                Göndər
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if(!text) return;

            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 p-4 rounded-xl max-w-lg text-sm">
                        ${text}
                    </div>
                </div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
